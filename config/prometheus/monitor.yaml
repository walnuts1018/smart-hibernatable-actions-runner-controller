# ServiceMonitor for the OpenTelemetry Prometheus exporter.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: smart-hibernatable-actions-runner-controller
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: metrics
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: smart-hibernatable-actions-runner-controller
