# This rule is not used by the project smart-hibernatable-actions-runner-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the gha.walnuts.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: smart-hibernatable-actions-runner-controller
    app.kubernetes.io/managed-by: kustomize
  name: runnerscaleset-editor-role
rules:
- apiGroups:
  - gha.walnuts.dev
  resources:
  - runnerscalesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gha.walnuts.dev
  resources:
  - runnerscalesets/status
  verbs:
  - get
