# This rule is not used by the project smart-hibernatable-actions-runner-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over gha.walnuts.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: smart-hibernatable-actions-runner-controller
    app.kubernetes.io/managed-by: kustomize
  name: runnernodepool-admin-role
rules:
- apiGroups:
  - gha.walnuts.dev
  resources:
  - runnernodepools
  verbs:
  - '*'
- apiGroups:
  - gha.walnuts.dev
  resources:
  - runnernodepools/status
  verbs:
  - get
