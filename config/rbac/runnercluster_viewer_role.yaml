# This rule is not used by the project smart-hibernatable-actions-runner-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to gha.walnuts.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: smart-hibernatable-actions-runner-controller
    app.kubernetes.io/managed-by: kustomize
  name: runnercluster-viewer-role
rules:
- apiGroups:
  - gha.walnuts.dev
  resources:
  - runnerclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gha.walnuts.dev
  resources:
  - runnerclusters/status
  verbs:
  - get
