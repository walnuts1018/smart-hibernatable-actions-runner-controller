apiVersion: gha.walnuts.dev/v1alpha1
kind: RunnerCluster
metadata:
  name: gha-amd64
spec:
  kubeconfigSecretRef:
    name: gha-amd64-kubeconfig
    key: kubeconfig
  runnerNamespace: gha-runners
  startup:
    machineRefs:
      - name: gha-amd64-01
  readiness:
    apiRequestTimeout: 5s
    nodeReadyTimeout: 10m
