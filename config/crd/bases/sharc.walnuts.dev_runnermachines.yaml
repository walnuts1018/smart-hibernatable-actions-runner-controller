---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runnermachines.sharc.walnuts.dev
spec:
  group: sharc.walnuts.dev
  names:
    categories:
    - sharc
    - all
    kind: RunnerMachine
    listKind: RunnerMachineList
    plural: runnermachines
    shortNames:
    - rmachine
    - rm
    singular: runnermachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Observed power state
      jsonPath: .status.powerState
      name: Power State
      type: string
    - description: Kubernetes Node readiness
      jsonPath: .status.kubernetes.ready
      name: Node Ready
      type: boolean
    - description: Scale-up priority
      jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RunnerMachine is the Schema for the runnermachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RunnerMachineSpec defines the desired state of RunnerMachine.
            properties:
              clusterRef:
                description: ClusterRef references the RunnerCluster this machine
                  belongs to.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: clusterRef is immutable
                  rule: self == oldSelf
              drain:
                description: Drain defines node draining parameters for the machine.
                properties:
                  timeout:
                    default: 10m
                    description: Timeout is the maximum duration to wait for runner
                      pods to drain before considering the drain stalled.
                    type: string
                type: object
              maintenance:
                description: Maintenance enables maintenance mode, preventing SHARC
                  from uncordoning or powering off this machine.
                properties:
                  enabled:
                    default: false
                    description: Enabled indicates whether the machine is in maintenance
                      mode.
                    type: boolean
                  powerPolicy:
                    default: Preserve
                    description: PowerPolicy defines whether to preserve power or
                      power off after draining during maintenance.
                    enum:
                    - Preserve
                    - PowerOff
                    type: string
                type: object
              nodeName:
                description: NodeName is the expected Node name in the runner Kubernetes
                  cluster.
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable
                  rule: self == oldSelf
              nodePoolRef:
                description: NodePoolRef references the RunnerNodePool this machine
                  belongs to.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              powerPolicy:
                default: OnDemand
                description: PowerPolicy defines the power policy (OnDemand or AlwaysOn).
                enum:
                - OnDemand
                - AlwaysOn
                type: string
              priority:
                default: 0
                description: Priority specifies selection priority when scaling up
                  (higher value = higher priority).
                format: int32
                type: integer
              redfish:
                description: Redfish specifies Redfish BMC configuration for power
                  management.
                properties:
                  credentialsSecretRef:
                    description: CredentialsSecretRef references the Secret containing
                      Redfish username and password keys.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  endpoint:
                    description: Endpoint is the URL of the Redfish service (e.g.,
                      https://192.168.10.50).
                    type: string
                  power:
                    description: Power defines power control options.
                    properties:
                      shutdown:
                        description: Shutdown defines parameters for graceful shutdown
                          and timeout fallback.
                        properties:
                          timeout:
                            default: 3m
                            description: Timeout is the duration to wait for graceful
                              OS shutdown before applying the TimeoutPolicy.
                            type: string
                          timeoutPolicy:
                            default: Abort
                            description: TimeoutPolicy specifies whether to abort
                              or force off if graceful shutdown exceeds the timeout.
                            enum:
                            - Abort
                            - ForceOff
                            type: string
                        type: object
                    type: object
                  systemID:
                    default: "1"
                    description: SystemID is the Redfish ComputerSystem ID to control
                      (e.g., "1").
                    type: string
                  tls:
                    description: TLS defines TLS parameters for Redfish connections.
                    properties:
                      caSecretRef:
                        description: CASecretRef optionally references a Secret containing
                          the CA certificate to trust.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      insecureSkipVerify:
                        default: false
                        description: InsecureSkipVerify skips TLS certificate verification
                          when connecting to the Redfish endpoint.
                        type: boolean
                    type: object
                required:
                - credentialsSecretRef
                - endpoint
                type: object
                x-kubernetes-validations:
                - message: endpoint must start with http:// or https://
                  rule: self.endpoint.startsWith('http://') || self.endpoint.startsWith('https://')
            required:
            - clusterRef
            - nodeName
            - redfish
            type: object
          status:
            description: RunnerMachineStatus defines the observed state of RunnerMachine.
            properties:
              conditions:
                description: Conditions store the detailed status conditions of the
                  machine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externallyCordoned:
                description: ExternallyCordoned indicates whether the Node was cordoned
                  by an external actor (e.g. admin kubectl cordon).
                type: boolean
              kubernetes:
                description: Kubernetes reflects the state of the machine's Node object
                  on the runner cluster.
                properties:
                  boundMachineID:
                    description: BoundMachineID is the machine-id from Node.Status.NodeInfo.MachineID
                      when SHARC initially bound this RunnerMachine.
                    type: string
                  machineID:
                    description: MachineID is preserved for backward compatibility
                      and matches BoundMachineID.
                    type: string
                  nodeUID:
                    description: NodeUID is the UID of the Node object on the runner
                      cluster.
                    type: string
                  observedMachineID:
                    description: ObservedMachineID is the current machine-id observed
                      from Node.Status.NodeInfo.MachineID.
                    type: string
                  present:
                    description: Present indicates whether a corresponding Kubernetes
                      Node object exists on the runner cluster.
                    type: boolean
                  ready:
                    description: Ready indicates whether the corresponding Kubernetes
                      Node has Ready condition=True.
                    type: boolean
                type: object
              lastPowerTransitionTime:
                description: LastPowerTransitionTime is the timestamp of the last
                  recorded power state transition.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  for this resource.
                format: int64
                type: integer
              operation:
                description: Operation tracks an in-progress power transition to prevent
                  redundant API calls.
                nullable: true
                properties:
                  attempts:
                    default: 1
                    description: Attempts is the number of times the command has been
                      dispatched.
                    format: int32
                    type: integer
                  drainVerifiedAt:
                    description: DrainVerifiedAt is the timestamp when the node was
                      verified to have 0 active runner pods before initiating shutdown.
                    format: date-time
                    type: string
                  lastAttemptAt:
                    description: LastAttemptAt is the timestamp when the operation
                      command was last sent to Redfish.
                    format: date-time
                    type: string
                  startedAt:
                    description: StartedAt is the timestamp when this operation was
                      initiated.
                    format: date-time
                    type: string
                  type:
                    description: Type is the kind of power operation being performed.
                    enum:
                    - PowerOn
                    - GracefulShutdown
                    - ForceOff
                    type: string
                required:
                - attempts
                - lastAttemptAt
                - startedAt
                - type
                type: object
              powerState:
                default: Unknown
                description: PowerState is the observed Redfish power state of the
                  machine.
                enum:
                - Unknown
                - "Off"
                - PoweringOn
                - "On"
                - PoweringOff
                type: string
              quarantine:
                description: Quarantine records isolation state if the machine failed
                  node readiness or shutdown timeout.
                nullable: true
                properties:
                  consecutiveFailures:
                    default: 1
                    description: ConsecutiveFailures is the number of consecutive
                      readiness or operation failures.
                    format: int32
                    type: integer
                  healthySince:
                    description: HealthySince is the timestamp when the machine started
                      observing continuous healthy Node state.
                    format: date-time
                    type: string
                  reason:
                    description: Reason describes why the machine was quarantined.
                    type: string
                  since:
                    description: Since is the timestamp when the machine entered quarantine.
                    format: date-time
                    type: string
                required:
                - consecutiveFailures
                - reason
                - since
                type: object
              redfishHealth:
                description: RedfishHealth tracks BMC communication health, error
                  backoff, and circuit breaker state.
                nullable: true
                properties:
                  circuit:
                    default: Closed
                    description: Circuit is the current circuit breaker state.
                    enum:
                    - Closed
                    - Open
                    - HalfOpen
                    type: string
                  consecutiveFailures:
                    description: ConsecutiveFailures is the number of consecutive
                      Redfish communication failures.
                    format: int32
                    type: integer
                  lastFailureTime:
                    description: LastFailureTime is the timestamp of the last failed
                      Redfish communication.
                    format: date-time
                    type: string
                  lastSuccessTime:
                    description: LastSuccessTime is the timestamp of the last successful
                      Redfish communication.
                    format: date-time
                    type: string
                  nextProbeTime:
                    description: NextProbeTime is the timestamp when the next Redfish
                      probe is allowed after backoff.
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
