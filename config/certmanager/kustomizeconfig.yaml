# The following config is for teaching kustomize where to look at when substituting vars.
# It requires cert-manager to be installed in the cluster.
nameReference:
- kind: Issuer
  group: cert-manager.io
  version: v1
  fieldSpecs:
  - kind: Certificate
    group: cert-manager.io
    path: spec/issuerRef/name

varReference:
- kind: Certificate
  group: cert-manager.io
  path: spec/dnsNames
