apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-hibernatable-actions-runner-controller.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "smart-hibernatable-actions-runner-controller.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smart-hibernatable-actions-runner-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "smart-hibernatable-actions-runner-controller.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "smart-hibernatable-actions-runner-controller.fullname" .) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          - /manager
          args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          {{- if .Values.listenerImage.repository }}
          - --listener-image={{ .Values.listenerImage.repository }}:{{ .Values.listenerImage.tag | default .Chart.AppVersion }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.telemetry.metrics.exporter | quote }}
            {{- with .Values.telemetry.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.metrics.exportInterval }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.metrics.exportTimeout }}
            - name: OTEL_METRIC_EXPORT_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.telemetry.metrics.exporter "otlp" }}
            {{- with .Values.telemetry.otlp.endpoint }}
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.otlp.protocol }}
            - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.otlp.headers }}
            - name: OTEL_EXPORTER_OTLP_METRICS_HEADERS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.otlp.compression }}
            - name: OTEL_EXPORTER_OTLP_METRICS_COMPRESSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.telemetry.otlp.timeout }}
            - name: OTEL_EXPORTER_OTLP_METRICS_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: ENABLE_WEBHOOKS
              {{- if .Values.webhook.enabled }}
              value: "true"
              {{- else }}
              value: "false"
              {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.webhook.enabled }}
          ports:
            - name: webhook-server
              containerPort: {{ .Values.webhook.port | default 9443 }}
              protocol: TCP
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            defaultMode: 420
            secretName: {{ .Values.webhook.certManager.certSecretName | default (printf "%s-webhook-cert" (include "smart-hibernatable-actions-runner-controller.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
