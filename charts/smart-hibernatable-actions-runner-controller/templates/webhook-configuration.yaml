{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "gha-baremetal-operator.fullname" . }}-mutating-webhook-configuration
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "gha-baremetal-operator.fullname" . }}-serving-cert
  {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "gha-baremetal-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-gha-walnuts-dev-v1alpha1-runnercluster
  failurePolicy: Fail
  name: mrunnercluster.kb.io
  rules:
  - apiGroups:
    - gha.walnuts.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - runnerclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "gha-baremetal-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-gha-walnuts-dev-v1alpha1-runnermachine
  failurePolicy: Fail
  name: mrunnermachine.kb.io
  rules:
  - apiGroups:
    - gha.walnuts.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - runnermachines
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "gha-baremetal-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-gha-walnuts-dev-v1alpha1-runnernodepool
  failurePolicy: Fail
  name: mrunnernodepool.kb.io
  rules:
  - apiGroups:
    - gha.walnuts.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - runnernodepools
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "gha-baremetal-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-gha-walnuts-dev-v1alpha1-runnerscaleset
  failurePolicy: Fail
  name: mrunnerscaleset.kb.io
  rules:
  - apiGroups:
    - gha.walnuts.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - runnerscalesets
  sideEffects: None
