replicaCount: 1

image:
  repository: ghcr.io/walnuts1018/smart-hibernatable-actions-runner-controller/manager
  pullPolicy: IfNotPresent
  tag: "latest"

listenerImage:
  repository: ghcr.io/walnuts1018/smart-hibernatable-actions-runner-controller/listener
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables for the manager container.
env: []

webhook:
  enabled: false
  port: 9443
  certManager:
    enabled: true
    certSecretName: ""

otel:
  # Supported values are none, prometheus, and otlp.
  metricsExporter: none
  serviceName: ""
  resourceAttributes: ""
  exporter:
    endpoint: ""
    protocol: grpc
