name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  release-artifacts:
    needs: determine-tag
    uses: ./.github/workflows/release-artifacts.yaml
    with:
      revision: ${{ github.sha }}
      release_tag: ${{ needs.determine-tag.outputs.release_tag }}
