name: Release Artifacts

on:
  workflow_call:
    inputs:
      revision:
        description: コミットSHA
        required: true
        type: string
      release_tag:
        description: 公開するrelease tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-artifacts-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build Docker Images (${{ matrix.arch.key }})
    runs-on: ${{ matrix.arch.os }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - key: linux-amd64
            os: ubuntu-26.04
            platform: linux/amd64
          - key: linux-arm64
            os: ubuntu-26.04-arm64
            platform: linux/arm64
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 3
              gc = true
              reservedSpace = "10%"
              maxUsedSpace = "60%"
              minFreeSpace = "20%"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache BuildKit mount caches (Go)
        id: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/buildkit-cache/go-mod
            ${{ runner.temp }}/buildkit-cache/go-build
          key: buildkit-cache-${{ matrix.arch.key }}-go-${{ hashFiles('go.sum') }}-${{ inputs.revision }}
          restore-keys: |
            buildkit-cache-${{ matrix.arch.key }}-go-${{ hashFiles('go.sum') }}-
            buildkit-cache-${{ matrix.arch.key }}-go-

      - name: Inject and extract BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/buildkit-cache/.dance
          skip-extraction: ${{ steps.cache-go.outputs.cache-hit == 'true' }}
          cache-map: |
            {
              "${{ runner.temp }}/buildkit-cache/go-mod": {
                "id": "gha-baremetal-go-mod",
                "target": "/go/pkg/mod"
              },
              "${{ runner.temp }}/buildkit-cache/go-build": {
                "id": "gha-baremetal-go-build",
                "target": "/root/.cache/go-build"
              }
            }

      - name: Build and push with Docker Bake
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH_KEY: ${{ matrix.arch.key }}
          PLATFORM: ${{ matrix.arch.platform }}
        with:
          source: .
          builder: ${{ steps.setup-buildx.outputs.name }}
          files: docker-bake.release.hcl
          targets: default
          provenance: false

      - name: Export image digests
        shell: bash
        env:
          PLATFORM: ${{ matrix.arch.platform }}
          METADATA_FILE: ${{ runner.temp }}/bake-metadata-${{ matrix.arch.key }}.json
          DIGEST_FILE: ${{ runner.temp }}/digests-${{ matrix.arch.key }}.json
        run: |
          cat << 'EOF' > "$METADATA_FILE"
          ${{ steps.bake.outputs.metadata }}
          EOF
          ./.github/scripts/export-image-digests.sh

      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch.key }}
          path: ${{ runner.temp }}/digests-${{ matrix.arch.key }}.json
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and Push Docker Images
    runs-on: ubuntu-26.04
    needs: docker
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists and push
        shell: bash
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          MERGED_DIGESTS: ${{ runner.temp }}/merged-digests.json
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./.github/scripts/publish-image-manifests.sh
