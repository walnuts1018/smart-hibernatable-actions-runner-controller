name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5083ab466144e5d5e236313175c5e8861d8ce4a7 # v2.1.13

      - name: Check linter configuration
        run: mise run lint-config
      - name: Run linter
        run: mise run lint
