name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lint_config: ${{ steps.filter.outputs.lint_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'cmd/**'
              - 'internal/**'
              - 'test/**'
              - 'config/**'
              - 'charts/**'
              - 'PROJECT'
              - 'Dockerfile'
              - 'mise.toml'
              - '.github/**'
            lint_config:
              - '.golangci.yml'
              - '.custom-gcl.yml'
              - '.github/workflows/**'
              - '**/*.sh'

  generate:
    name: Verify generated code
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go go:sigs.k8s.io/controller-tools/cmd/controller-gen kustomize

      - name: Generate manifests and code
        run: |
          mise run manifests
          mise run generate
          go mod tidy

      - name: Check for uncommitted changes
        uses: ./.github/actions/check-generated

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.lint_config == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go golangci-lint actionlint shellcheck
          golangci-lint-cache: "true"

      - name: Build custom golangci-lint
        run: |
          if [ ! -x bin/custom-gcl ]; then
            mise run build-golangci-lint
          fi

      - name: Validate workflows and shell scripts
        run: mise run lint:workspace

      - name: Run golangci-lint
        run: ./bin/custom-gcl run ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go go:sigs.k8s.io/controller-runtime/tools/setup-envtest go:sigs.k8s.io/controller-tools/cmd/controller-gen jq

      - name: Run unit tests
        run: mise run test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go kind kubectl go:sigs.k8s.io/controller-runtime/tools/setup-envtest go:sigs.k8s.io/controller-tools/cmd/controller-gen kustomize jq

      - name: Run e2e tests
        run: mise run test-e2e

  build:
    name: Build binaries & installer
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go kustomize go:sigs.k8s.io/controller-tools/cmd/controller-gen

      - name: Build binaries
        run: mise run build

      - name: Build installer manifest
        run: mise run build-installer

  status-check:
    name: status-check
    runs-on: ubuntu-latest
    needs:
      - changes
      - generate
      - lint
      - test
      - test-e2e
      - build
    if: always()
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            to_entries
            | map(select(.value.result | IN("success", "skipped") | not))
            | if length == 0 then
                "All required jobs passed or were skipped successfully."
              else
                "Failed jobs: " + (map(.key) | join(", "))
                | halt_error(1)
              end
          '
