name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  controller:
    name: controller
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/controller-runtime/tools/setup-envtest kustomize golangci-lint shellcheck kind kubectl jq helm
          golangci-lint-cache: "true"

      - name: Generate manifests and code
        run: |
          mise run manifests
          mise run generate
          go mod tidy

      - name: Build custom golangci-lint
        run: |
          if [ ! -x bin/custom-gcl ]; then
            mise run build-golangci-lint
          fi
          ln -sf custom-gcl bin/golangci-lint
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - parallel:
          - name: Validate workflows and shell scripts
            run: mise run lint:shell
          - name: Lint Helm chart
            run: mise run lint:chart
          - name: Run golangci-lint
            uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
            with:
              install-mode: "none"
          - name: Run unit tests
            run: mise run test
          - name: Run e2e tests
            run: mise run test-e2e
          - name: Build binaries
            run: mise run build
          - name: Build installer manifest
            run: mise run build-installer
          - name: Format code
            run: mise run fmt

      - name: Check for uncommitted changes
        uses: ./.github/actions/check-generated

  status-check:
    name: status-check
    if: always()
    needs:
      - controller
    runs-on: ubuntu-slim
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            to_entries
            | map(select(.value.result | IN("success", "skipped") | not))
            | if length == 0 then
                "All required jobs passed or were skipped successfully."
              else
                "Failed jobs: " + (map(.key) | join(", "))
                | halt_error(1)
              end
          '
