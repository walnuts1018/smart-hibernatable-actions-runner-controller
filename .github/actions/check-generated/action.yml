name: Check Generated Files
description: Check that repository files have no uncommitted diffs or untracked files after code generation

inputs:
  paths:
    description: Paths to check (space separated). If empty, checks entire working directory.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify generated file diffs
      shell: bash
      env:
        CHECK_PATHS: ${{ inputs.paths }}
      run: |
        if [ -n "$CHECK_PATHS" ]; then
          read -r -a path_args <<< "$CHECK_PATHS"
          if ! git diff --exit-code -- "${path_args[@]}"; then
            echo "::error::Generated files are out of date. Please run code generation / tidy locally and commit the changes."
            exit 1
          fi

          untracked_files="$(git ls-files --others --exclude-standard -- "${path_args[@]}")"
          if [ -n "$untracked_files" ]; then
            echo "::error::Untracked files were generated:"
            printf '%s\n' "$untracked_files"
            exit 1
          fi
        else
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Please run code generation / tidy locally and commit the changes."
            exit 1
          fi

          untracked_files="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked_files" ]; then
            echo "::error::Untracked files were generated:"
            printf '%s\n' "$untracked_files"
            exit 1
          fi
        fi
