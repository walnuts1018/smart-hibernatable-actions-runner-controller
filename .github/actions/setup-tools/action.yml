name: Setup Tools and Cache
description: Composite action to set up mise tools and configure Go and golangci-lint caches

inputs:
  tools:
    description: Space-separated list of mise tools to install
    required: true
  go-cache:
    description: Whether to enable Go module and build cache
    required: false
    default: "true"
  golangci-lint-cache:
    description: Whether to enable golangci-lint cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Go module and build cache
      if: inputs.go-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-cache-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-cache-${{ runner.os }}-

    - name: golangci-lint cache
      if: inputs.golangci-lint-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml', '.custom-gcl.yml') }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-

    - name: Custom golangci-lint binary cache
      if: inputs.golangci-lint-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bin/custom-gcl
        key: custom-gcl-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml', '.custom-gcl.yml') }}

    - name: Setup mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install_args: ${{ inputs.tools }}
        cache: true

    - name: Disable mise auto-install for subsequent steps
      shell: bash
      run: |
        echo "MISE_TASK_RUN_AUTO_INSTALL=false" >> "$GITHUB_ENV"
        echo "MISE_AUTO_INSTALL=false" >> "$GITHUB_ENV"
