[tools]
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.21.0"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.24.1"
"go:sigs.k8s.io/kustomize/kustomize/v5" = "5.8.1"
kind = "0.32.0"
kubebuilder = "4.15.0"
kubectl = "1.36.3"
jq = "1.8.2"
golangci-lint = "2.12.2"
go = "1.27.0"
shellcheck = "0.11.0"
gh = "2.97.0"
"npm:@devcontainers/cli" = "0.88.0"

[tasks.test]
description = "Run tests"
run = "go test ./... -v"

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.manifests]
description = "Generate WebhookConfiguration, ClusterRole and CustomResourceDefinition objects"
run = "controller-gen rbac:roleName=manager-role crd webhook paths=\"./...\" output:crd:artifacts:config=config/crd/bases output:webhook:artifacts:config=config/webhook output:rbac:artifacts:config=config/rbac && cp config/crd/bases/*.yaml charts/smart-hibernatable-actions-runner-controller/crds/"

[tasks.generate]
description = "Generate code containing DeepCopy, DeepCopyInto, and DeepCopyObject method implementations"
run = "controller-gen object:headerFile=\"hack/boilerplate.go.txt\",year=2026 paths=\"./...\""

[tasks.build]
description = "Build manager and listener binaries"
run = "go build -o bin/manager cmd/main.go && go build -o bin/listener cmd/listener/main.go"

